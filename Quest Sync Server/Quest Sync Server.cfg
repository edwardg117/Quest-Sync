# Command Interface settings
# Control the server's command-line interface
[CommandInterface]
Enabled=true

# Connection settings
# Control how clients connect to the server
[Connection]
# Maximum number of clients that can connect simultaneously
MaxClients=10
# Connection timeout in seconds
Timeout=30

# Logging configuration settings
# Control how the server logs information
# Log levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
[Logging]
# The minimum level of messages to display in the console
ConsoleLevel=INFO
# The minimum level of messages to write to the log file
FileLevel=DEBUG
# The name of the log file
LogFile=Quest Sync Server.log

# Performance settings
# Control server performance and resource usage
[Performance]
# Interval in seconds between heartbeat messages to clients
HeartbeatInterval=5

# Security settings
# Control authentication and access restrictions
[Security]
# Comma-separated list of allowed IP addresses. Leave empty to allow all
AllowedIPs=
# Whether to require authentication for clients (true/false)
EnableAuthentication=false
# Password required for client authentication (leave empty for no password)
Password=
# Maximum authentication attempts per IP within the rate limit window
RateLimitAttempts=5
# Enable rate limiting for authentication attempts (true/false)
RateLimitEnabled=true
# Rate limit window in seconds
RateLimitWindow=300
# Session token expiry time in seconds
SessionTokenExpiry=3600

# Server configuration settings
# These settings control the network behavior of the server
[Server]
# The IP address to bind to. Leave empty to bind to all available interfaces
IpAddress=
# The port number the server will listen on
Port=25575

