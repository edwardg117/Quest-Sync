# Quest Sync NVSE Plugin Configuration
# This file is automatically generated if it doesn't exist

[Network]
# The IP address of the Quest Sync server
ServerAddress=127.0.0.1
# The port of the Quest Sync server
ServerPort=25575
# Time in seconds between reconnection attempts
ReconnectInterval=60
# Maximum number of reconnection attempts
MaxReconnectAttempts=5
# Connection timeout in seconds
ConnectionTimeout=5
# Number of reconnect attempts when loading a save game (0 to disable)
SaveGameReconnectAttempts=2
# Milliseconds between reconnect attempts when loading a save game
SaveGameReconnectDelay=1000

[Client]
# Client version (do not change manually)
Version=1.0
# Log level (DEBUG, INFO, WARNING, ERROR)
LogLevel=INFO

[Security]
# Password for server authentication (leave empty if server has no password)
Password=
